name = "PrimeFactorUnimodality"
version = "0.1.0"
defaultTargets = ["PrimeFactorUnimodality", "Challenge", "Solution"]
lintDriver = "batteries/runLinter"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.flexible = true
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[require]]
name = "PrimeNumberTheoremAnd"
git = "https://github.com/kimihiro64/PrimeNumberTheoremAnd.git"
rev = "f8f58c749d6cde8a641348fcd5e4702993651cd6"

[[lean_lib]]
name = "PrimeFactorUnimodality"

[[lean_lib]]
name = "VendorPrimeNumberTheoremAnd"
roots = [
  "VendorPrimeNumberTheoremAnd.ElementaryChebyshev",
  "VendorPrimeNumberTheoremAnd.EulerMaclaurin",
  "VendorPrimeNumberTheoremAnd.Mertens",
]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
