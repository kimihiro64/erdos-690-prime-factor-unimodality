# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Erdos 690: Prime-factor density unimodality"
  description: >-
    An unconditional Lean proof that the prime-factor density sequence is
    unimodal exactly for the first three positions, using elementary
    Chebyshev and Mertens estimates in the full infinite tail.
  authors: ["Jonas Whidden"]
  license: "Apache-2.0"
  responsible_maintainers: ["Jonas Whidden"]

classification:
  arxiv: ["math.NT"]
  msc2020: ["11A25", "03B35"]

sources:
  - title: "Resolution of Erdos' problems about unimodularity"
    authors: ["Stijn Cambie"]
    id: "arXiv:2501.10333"
    type: "article"
    location: "https://arxiv.org/abs/2501.10333"
    relationship: "formalizes"
    note: "Finite density formula, positive cases, and initial counterexamples."
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "A Complete Answer to Erdos Problem 690"
    authors: ["Shouqiao Wang", "Davide Crapis"]
    id: "arXiv:2605.08542v1"
    type: "article"
    location: "https://arxiv.org/abs/2605.08542v1"
    relationship: "adapts"
    note: >-
      Complete classification and descent-before-ascent strategy. The
      formalization replaces the sharp analytic premise by elementary
      estimates and retains a finite/tail split at 38000.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Sharper bounds for the Chebyshev function theta(x)"
    authors: ["S. Broadbent", "H. Kadiri", "A. Lumley", "N. Ng", "K. Wilk"]
    id: "arXiv:2002.11068"
    type: "article"
    location: "https://arxiv.org/abs/2002.11068"
    relationship: "background"
    note: "Historical elementary inequalities in Section 1.1; no zero-based estimates are used."
  - title: "Mertens' Proof of Mertens' Theorem"
    authors: ["M. B. Villarino"]
    id: "arXiv:math/0504289"
    type: "article"
    location: "https://arxiv.org/abs/math/0504289"
    relationship: "background"

related_formalizations: []

status:
  scope: >-
    The advertised classification for every positive natural k is proved
    unconditionally by completeClassification_elementary and exported by
    Solution.lean. A separate periodic-counting theorem identifies the exact
    rational formula with natural density. Historical conditional and Dusart
    modules are retained separately and are not inputs to the final proof.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Codex"]
      framework: "Lean 4 and Mathlib"
      tool_setup: "Human-directed proof development, focused Lean compilation, scripted fixed certificates, and axiom audits"
      cost:
        wall_time: "not measured end to end"
        spend_usd: "subscription-based"
        hardware: "local machine and GitHub CI"
      prompting_notes: "Explicit definitions, theorem-state checks, and separate compilation and axiom audits."
  spend_usd: "subscription-based"
  notes: "AI-assisted development; no claim that automated checking establishes source fidelity or independent mathematical review."

fidelity:
  divergences: >-
    The Wang--Crapis descent/ascent argument is adapted to a finite/tail
    split at 38000. A strict finite coefficient/mean comparison, elementary
    factorial and Chebyshev estimates, smoothed Abel summation, and an
    average-gap interval (4P,400P] replace the published Dusart input.
    The original fixed gap/twin witnesses and cases through k=48 are retained.

review:
  status: "self-assessed"
  reviewers: ["none"]
  notes: >-
    The exact all-k theorem and a separate transport to the actual
    Mathlib-only Challenge definitions compile with only propext,
    Classical.choice and Quot.sound. Source and architecture audits pass.
    Existing fixed-certificate build objects were reused after byte/hash
    verification. Independent expert review, a full fresh certificate
    replay, and independent NanoDa replay of this update are not claimed.

alignment:
  namespace: "PrimeFactorUnimodality"
  statements:
    - source: "Wang--Crapis all-k classification"
      lean: "PrimeFactorUnimodality.completeClassification_elementary"
      module: "PrimeFactorUnimodality/Proof/CompleteClassificationElementary.lean"
      status: "full"
      note: "For every k>=1, the exact prime-factor density sequence is unimodal iff k<=3, with no analytic parameter."

acknowledgements: "Stijn Cambie, Shouqiao Wang, Davide Crapis, the authors of the elementary analytic sources, and the Lean, Mathlib, PrimeCert and PrimeNumberTheoremAnd contributors."
