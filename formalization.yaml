# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4. Replace every TEMPLATE value before submitting.
# Replace a placeholder list with [] only when its adjacent comment permits it;
# lists described as required must remain nonempty.
version: "v0.4"

project:
  name: "Erdos 690: Prime-factor density unimodality"
  description: >-
    A Lean formalization of the all-k classification of the prime-factor
    density sequence, including the explicit analytic reductions used by the
    Wang--Crapis argument.
  # Required nonempty list of name strings or mappings with a nonempty name.
  authors:
    - "Jonas Whidden"
  # Required root licence. Keep this in sync with the Apache-2.0 LICENSE file.
  license: "Apache-2.0"
  # Required nonempty list of name strings or mappings with a nonempty name.
  # For a thin wrapper, name people responsible for this submitted wrapper;
  # submission authorization separately covers the underlying formalization.
  responsible_maintainers:
    - "Jonas Whidden"

# Omit repository for an ordinary project: Palomar treats this submitted
# repository as the substantive proof development. If this repository is only
# a thin Comparator wrapper, uncomment and pin the actual formalization in this
# exact shape:
# repository:
#   substantive_formalization:
#     id: "TEMPLATE: owner/repository or https://github.com/owner/repository"
#     revision: "TEMPLATE: full 40-character lowercase commit SHA"

classification:
  # Use 1–2 official arXiv identifiers such as math.LO and 1–8 five-character
  # MSC 2020 identifiers such as 03B35.
  arxiv: ["math.NT"]
  msc2020: ["11A25", "03B35"]

sources:
  # Sources must be nonempty. Every source needs a title and relationship; the
  # relationship must be exactly formalizes, adapts, independently-proves,
  # background, or other.
  # Choose one result origin:
  # - For a theorem first presented by this formalization, set one source to
  #   type: original-proof and relationship: other. All additional source
  #   relationships must be background or other.
  # - Otherwise, omit type: original-proof and give at least one source a
  #   formalizes, adapts, or independently-proves relationship. A new proof of
  #   a known published result is source-based and uses independently-proves.
  # Type, authors, contributors, id, location, note, license, and
  # author_endorsement are optional; remove them when genuinely inapplicable.
  # Authors are bibliographic authors. Contributors record other source roles,
  # with one name and free-form role such as editor or problem-proposer.
  # Type is a concise free-text
  # description such as article, paper, book, formalization, web post, folklore,
  # conversation, or other. The exact value original-proof is reserved for the
  # result-origin declaration described above.
  # Original-result example:
  # - title: "TEMPLATE: describe the result first presented here"
  #   type: original-proof
  #   relationship: other
  - title: "Estimates of Some Functions Over Primes without R.H."
    authors:
      - "Pierre Dusart"
    id: "arXiv:1002.0442"
    type: "article"
    location: "https://arxiv.org/abs/1002.0442"
    relationship: "adapts"
    note: "The explicit prime-distribution estimates are formalized as source-level Lean obligations and assembled into the target argument."
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    The public all-k statement and its structural reductions are present. The
    remaining work is the direct Lean construction of the finite Dusart data
    and the explicit analytic tail providers; those obligations are exposed
    as source-level inputs rather than hidden declarations.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  # status.main_results is optional. Add it only when a short curated
  # project-level list is useful; it need not mirror Comparator declarations.

automation:
  methods:
    - method: "agent"
      models: ["Codex"]
      framework: "Lean 4 and Mathlib"
      tool_setup: "AI-assisted Lean source development, scripted finite-data generation, and GitHub CI elaboration"
      cost:
        wall_time: "ongoing"
        spend_usd: "subscription-based"
        hardware: "local machine and GitHub CI"
      prompting_notes: "Directed proof development with source-level analytic obligations kept explicit."
  spend_usd: "subscription-based"
  notes: "Human-directed, AI-assisted Lean development with CI used for elaboration diagnostics."

fidelity:
  divergences: "The formalization exposes finite computational tables and analytic estimates as explicit Lean obligations while their direct proofs are being completed."

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: "Statement and dependency boundaries have been audited; the analytic provider proofs remain under development."

alignment:
  namespace: "PrimeFactorUnimodality"
  statements:
    - source: "Wang--Crapis all-k classification"
      lean: "PrimeFactorUnimodality.CompleteClassification"
      module: "PrimeFactorUnimodality/Definitions/KthPrimeFactor.lean"
      status: "partial"
      note: "The universal statement is fixed; the final analytic providers are still being constructed directly in Lean."

acknowledgements: "Mathlib, Lean, and the authors of the cited prime-distribution literature."
