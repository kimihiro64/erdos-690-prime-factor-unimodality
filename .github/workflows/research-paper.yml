name: Research paper

# The release and manual diagnostics run the same paper build and inspections.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    name: Build research paper
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install paper toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            lmodern \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended
      - name: Build and inspect the paper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p paper/build
          git log -1 --format=%ct -- paper/research-paper.tex > paper/build/source-date-epoch
          read -r SOURCE_DATE_EPOCH < paper/build/source-date-epoch
          export SOURCE_DATE_EPOCH
          export FORCE_SOURCE_DATE=1
          export TZ=UTC
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error \
            -output-directory=paper/build paper/research-paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error \
            -output-directory=paper/build paper/research-paper.tex
          if grep -F \
            -e 'undefined references' \
            -e 'undefined citations' \
            -e 'Rerun to get cross-references right' \
            paper/build/research-paper.log
          then
            exit 1
          fi
          test -s paper/build/research-paper.pdf
          pdfinfo paper/build/research-paper.pdf
          grep -F '% SPDX-License-Identifier: Apache-2.0 OR CC-BY-4.0' \
            paper/research-paper.tex
          pdftotext paper/build/research-paper.pdf paper/build/research-paper.txt
          for license in Apache-2.0 CC-BY-4.0; do
            if ! grep -F "$license" paper/build/research-paper.txt; then
              echo "::error::Paper PDF is missing license identifier $license"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: research-paper
          path: paper/build/research-paper.pdf
          if-no-files-found: error
          retention-days: 90
