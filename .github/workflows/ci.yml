name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Incremental proof commits must not cancel an expensive running main build.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  release_version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_ready: ${{ steps.version.outputs.release_ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate committed release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < RELEASE_VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=RELEASE_VERSION::Expected one semantic version such as 0.1.0"
            exit 1
          fi
          if [[ "$(cat RELEASE_VERSION)" != "$version" ]]; then
            echo "::error file=RELEASE_VERSION::Release version contains surrounding whitespace"
            exit 1
          fi
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if grep -Fq 'TEMPLATE:' formalization.yaml; then
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release_ready=true" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" != refs/heads/main ]] ||
             [[ "$GITHUB_EVENT_NAME" != push && "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            exit 0
          fi

          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tagged_commit=$(git rev-list -n 1 "$tag")
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "::error file=RELEASE_VERSION::$tag belongs to $tagged_commit; bump RELEASE_VERSION before the long build"
              exit 1
            fi
          fi

  metadata-and-boundary:
    name: Metadata, source policy, and private boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Test the Palomar metadata validator
        run: ruby test/validate_formalization_test.rb
      - name: Validate lifecycle metadata and public source boundary
        run: python scripts/check.py --profile fast
      - name: Detect the repository licence
        run: |
          bundle exec licensee detect LICENSE --json --no-packages --no-readme > "$RUNNER_TEMP/license.json"
          ruby -rjson -e '
            report = JSON.parse(File.read(ARGV.fetch(0)))
            identifiers = report.fetch("licenses").map { |item| item.fetch("spdx_id") }
            abort "LICENSE is not detected exactly as Apache-2.0" unless identifiers == ["Apache-2.0"]
          ' "$RUNNER_TEMP/license.json"

  release-licensing:
    name: Check release licensing bundles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          lint: false
      - name: Fetch the pinned project dependencies
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: lake update
      - name: Fetch the pinned documentation dependencies
        working-directory: docbuild
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: lake update
      - name: Exercise producer and release-consumer packaging
        # Both dependency updates above share the project package directory.
        shell: pwsh
        run: |
          python3 scripts/patch_pnt_compat.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./test/release_licensing_test.ps1

  python:
    name: Python format, lint, types, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned development tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Check formatting
        run: python -m ruff format --check scripts test/python
      - name: Lint
        run: python -m ruff check scripts test/python
      - name: Type-check
        run: python -m mypy scripts test/python
      - name: Test
        run: python -m pytest

  sandbox:
    name: Check the Landrun wrapper's flag policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test the Landrun wrapper
        run: ./test/landrun_wrapper_test.sh

  lean-foundations:
    name: Elaborate non-certificate Lean foundations
    # Keep source-policy failure from hiding the diagnostic foundation build
    # while the public theorem is still being closed.  The complete build
    # below remains gated by metadata-and-boundary.
    needs: [python]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          lint: false
