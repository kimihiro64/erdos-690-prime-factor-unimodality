  build:
    name: Replay certificates and build with Lean
    needs: [release_version, metadata-and-boundary, python, certificate-prebuild, analytic-tail]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          lint: false
      - name: Restore certificate prebuild artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: lean-certificate-prebuild
          path: .lake/build
      - name: Restore the checked analytic reduction
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: lean-analytic-tail
          path: .lake/build
      - name: Build the complete formalization
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/patch_pnt_compat.py
          python3 scripts/check_tail_replacement.py
          : > lean-build.log
          : > lean-build-processes.log
          (
            while :; do
              {
                date --iso-8601=seconds
                free -h
                ps -eo pid,ppid,rss,etime,args --sort=-rss | head -n 35
                echo
              } >> lean-build-processes.log
              sleep 10
            done
          ) &
          monitor_pid=$!
          trap 'status=$?; kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true; echo "lake build exit status: $status"; tail -n 120 lean-build.log; echo "--- final process snapshot ---"; free -h; ps -eo pid,ppid,rss,etime,args --sort=-rss | head -n 35; exit "$status"' EXIT
          lake -v build 2>&1 | tee lean-build.log
          exit "${PIPESTATUS[0]}"
      - name: Print Lean build diagnostics
        if: always()
        run: |
          echo '--- last build trace lines ---'
          tail -n 160 lean-build.log 2>/dev/null || true
          echo '--- last process snapshots ---'
          tail -n 160 lean-build-processes.log 2>/dev/null || true
      - name: Upload Lean build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lean-build-diagnostics
          path: |
            lean-build.log
            lean-build-processes.log
          if-no-files-found: warn
          retention-days: 7
      - name: Run the Lean linters
        run: lake lint
      - name: Upload the completed Lean build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-lean-build
          path: .lake/build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  docs:
