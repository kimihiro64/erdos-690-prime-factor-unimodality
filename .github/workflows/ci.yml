        with:
          build: false
          lint: false
      - name: Restore elaborated foundation artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: lean-foundations-build
          path: .lake/build
      - name: Prebuild high-memory generated chains serially
        run: |
          python3 scripts/patch_pnt_compat.py
          /usr/bin/time -v lake build \
            +PrimeFactorUnimodality.Helpers.FiniteCertificates.KadiriKernelNumerical
          lake env lean test/lean/KadiriKernelNumerical.lean
          lake build \
            +PrimeFactorUnimodality.Helpers.FiniteCertificates.Generated.PrimePrefixes
          lake build \
            +PrimeFactorUnimodality.Helpers.FiniteCertificates.Generated.FixedWeightSums
      - name: Upload certificate prebuild artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lean-certificate-prebuild
          path: |
            .lake/build/lib/lean
            .lake/build/ir
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  analytic-tail:
    name: Check the certificate-independent all-k reduction
