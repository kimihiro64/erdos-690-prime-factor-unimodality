  comparator:
    name: Check statement against solution
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          lint: false
      - name: Fetch dependencies
        run: lake update
      - name: Apply the reviewed Lean compatibility ports
        run: python3 scripts/patch_pnt_compat.py
      - name: Restore the completed Lean build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
