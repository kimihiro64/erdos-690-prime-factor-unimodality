          cache: false
      - name: Run pinned Comparator toolchain
        run: bash scripts/verify-comparator.sh

  paper:
    name: Build research paper
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install paper toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            lmodern \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended
      - name: Build and inspect the paper
        run: |
          mkdir -p paper/build
          git log -1 --format=%ct -- paper/research-paper.tex > paper/build/source-date-epoch
          read -r SOURCE_DATE_EPOCH < paper/build/source-date-epoch
          export SOURCE_DATE_EPOCH
          export FORCE_SOURCE_DATE=1
          export TZ=UTC
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error \
            -output-directory=paper/build paper/research-paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error \
            -output-directory=paper/build paper/research-paper.tex
          if grep -F \
            -e 'undefined references' \
            -e 'undefined citations' \
            -e 'Rerun to get cross-references right' \
            paper/build/research-paper.log
          then
            exit 1
          fi
          test -s paper/build/research-paper.pdf
          pdfinfo paper/build/research-paper.pdf
          grep -F '% SPDX-License-Identifier: Apache-2.0 OR CC-BY-4.0' \
            paper/research-paper.tex
          pdftotext paper/build/research-paper.pdf - \
            | grep -F 'Apache License 2.0'
          pdftotext paper/build/research-paper.pdf - \
            | grep -F 'CC BY 4.0'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: research-paper
          path: paper/build/research-paper.pdf
          if-no-files-found: error
          retention-days: 90

  submission-link:
    name: Check submission link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require the current Palomar form and reject the retired form
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          form = "https://submit.palomar-registry.org/"
          retired = re.compile(r"PalomarSubmission/issues/new")
          failed = False
          if form not in pathlib.Path("README.md").read_text():
              print(f"README.md: does not name {form}")
              failed = True
          for document in sorted(pathlib.Path(".").rglob("*.md")):
              if ".lake" in document.parts:
                  continue
              for number, line in enumerate(document.read_text().splitlines(), 1):
                  if retired.search(line):
                      print(f"{document}:{number}: retired Palomar form")
                      failed = True
          raise SystemExit(failed)
          PY

  release:
    name: Publish verified release
    if: >-
      needs.release_version.outputs.release_ready == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - release_version
      - metadata-and-boundary
      - release-licensing
      - python
      - sandbox
      - build
      - docs
      - comparator
      - paper
      - submission-link
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release_version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check whether this exact release is already complete
        id: release_state
        shell: bash
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
          if [[ -z "$release_id" ]]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "draft_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          target=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq .target_commitish)
          if [[ "$target" != "$GITHUB_SHA" ]]; then
            echo "::error::$RELEASE_TAG targets $target instead of $GITHUB_SHA"
            exit 1
          fi
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq .draft)
          if [[ "$draft" == true ]]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "draft_id=$release_id" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          expected=$(printf '%s\n' \
            "erdos-690-prime-factor-unimodality-api-documentation-$RELEASE_TAG.zip" \
            'erdos-690-prime-factor-unimodality-research-paper.pdf' \
            "erdos-690-prime-factor-unimodality-linux-lean-$RELEASE_TAG.tar.zst" | sort)
          actual=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --jq '.assets[].name' | sort)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Existing $RELEASE_TAG release has the wrong asset set"
            exit 1
          fi
          if [[ $(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              --jq '[.assets[] | select(.state != "uploaded" or .size <= 0)] | length') != 0 ]]; then
            echo "::error::Existing $RELEASE_TAG release has an incomplete asset"
            exit 1
          fi
          echo "complete=true" >> "$GITHUB_OUTPUT"
          echo "draft_id=" >> "$GITHUB_OUTPUT"
      - name: Download the research paper
        if: steps.release_state.outputs.complete != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: research-paper
          path: release-inputs/paper
      - name: Download the completed Lean build
        if: steps.release_state.outputs.complete != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: linux-lean-build
          path: release-inputs/linux-build
      - name: Download the API documentation
        if: steps.release_state.outputs.complete != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: api-documentation
          path: release-inputs/api-documentation
      - name: Validate and package the three release assets
        if: steps.release_state.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for command in gh jq sha256sum stat tar zip zstd; do
            command -v "$command" >/dev/null
          done
          test -s release-inputs/paper/research-paper.pdf
          test -s release-inputs/linux-build/lib/lean/Challenge.olean
          test -s release-inputs/linux-build/lib/lean/Solution.olean
          test -s release-inputs/api-documentation/licensing/index.html
          test -s release-inputs/api-documentation/licensing/PrimeFactorUnimodality-Apache-2.0.txt
          pwsh -File scripts/prepare-api-docs.ps1 \
            -DocumentationRoot release-inputs/api-documentation \
            -UsePreparedLicensing
          pwsh -File scripts/prepare-release-licensing.ps1 \
            -DestinationRoot release-inputs/linux-build

          mkdir release-assets
          cp release-inputs/paper/research-paper.pdf \
            release-assets/erdos-690-prime-factor-unimodality-research-paper.pdf
          (
            cd release-inputs/api-documentation
            zip -q -r -6 \
              "$GITHUB_WORKSPACE/release-assets/erdos-690-prime-factor-unimodality-api-documentation-$RELEASE_TAG.zip" .
          )
          tar -C release-inputs/linux-build -cf - . |
            zstd -T0 -10 -q \
              -o "release-assets/erdos-690-prime-factor-unimodality-linux-lean-$RELEASE_TAG.tar.zst"

          mapfile -t build_entries < <(
            tar --use-compress-program=unzstd -tf \
              "release-assets/erdos-690-prime-factor-unimodality-linux-lean-$RELEASE_TAG.tar.zst" |
              sed -e 's#\\#/#g' -e 's#^\./##'
          )
          for entry in "${build_entries[@]}"; do
            case "$entry" in
              /*|[A-Za-z]:/*|../*|*/../*)
                echo "::error::Unsafe Lean archive entry: $entry"
                exit 1
                ;;
            esac
          done
          for required in \
            LICENSE \
            LICENSING.md \
            lib/lean/Challenge.olean \
            lib/lean/Solution.olean
          do
            count=0
            for entry in "${build_entries[@]}"; do
              if [[ "$entry" == "$required" ]]; then
                count=$((count + 1))
              fi
            done
            if [[ "$count" -ne 1 ]]; then
              echo "::error::Lean archive contains $count copies of $required"
              exit 1
            fi
          done

          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 3
          sha256sum release-assets/* > release-assets.sha256
          {
            echo "Automated release for commit \`$GITHUB_SHA\`."
            echo
            echo "Every required CI gate passed, including the full Lean build, metadata and public-boundary checks, paper and documentation builds, Comparator statement matching, NanoDa replay, and Lean default-kernel replay."
            echo
            echo "## Assets"
            echo
            echo "- \`erdos-690-prime-factor-unimodality-research-paper.pdf\`: research paper."
            echo "- \`erdos-690-prime-factor-unimodality-linux-lean-$RELEASE_TAG.tar.zst\`: completed Ubuntu \`.lake/build\` contents with project licensing information."
            echo "- \`erdos-690-prime-factor-unimodality-api-documentation-$RELEASE_TAG.zip\`: offline API documentation with applicable third-party notices."
            echo
            echo "## SHA-256"
            echo
            echo '```text'
            cat release-assets.sha256
            echo '```'
          } > release-notes.md
      - name: Create or complete the draft release
        if: steps.release_state.outputs.complete != 'true'
        shell: bash
        env:
          DRAFT_ID: ${{ steps.release_state.outputs.draft_id }}
        run: |
          set -euo pipefail
          if [[ -z "$DRAFT_ID" ]]; then
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Erdos 690: Prime-Factor Density Unimodality $RELEASE_TAG" \
              --notes-file release-notes.md \
              --draft
          else
            gh release upload "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Erdos 690: Prime-Factor Density Unimodality $RELEASE_TAG" \
              --notes-file release-notes.md
          fi

          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft == true) | .id")
          test -n "$release_id"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --jq '.assets | length')" -eq 3
          for asset in release-assets/*; do
            name=$(basename "$asset")
            local_size=$(stat -c '%s' "$asset")
            remote_size=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              --jq ".assets[] | select(.name == \"$name\" and .state == \"uploaded\") | .size")
            test "$remote_size" = "$local_size"
          done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest
      - name: Verify the published assets are downloadable
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          test "$(jq -r .draft <<< "$release")" = false
          test "$(jq -r .prerelease <<< "$release")" = false
          test "$(jq -r .target_commitish <<< "$release")" = "$GITHUB_SHA"
          test "$(jq '.assets | length' <<< "$release")" -eq 3
          test "$(jq '[.assets[] | select(.state != "uploaded" or .size <= 0)] | length' \
            <<< "$release")" -eq 0
          mkdir verified-release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir verified-release-assets
          expected=$(printf '%s\n' \
            "erdos-690-prime-factor-unimodality-api-documentation-$RELEASE_TAG.zip" \
            'erdos-690-prime-factor-unimodality-research-paper.pdf' \
            "erdos-690-prime-factor-unimodality-linux-lean-$RELEASE_TAG.tar.zst" | sort)
          actual=$(find verified-release-assets -maxdepth 1 -type f \
            -printf '%f\n' | sort)
          test "$actual" = "$expected"
          test "$(find verified-release-assets -maxdepth 1 -type f -size +0c | wc -l)" -eq 3
