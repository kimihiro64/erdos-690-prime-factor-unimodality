name: Conditional all-k proof

# Generated by scripts/render_conditional_workflow.py; omits Comparator and post-build Lean lint.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.ref == 'refs/heads/main' && 'conditional-dusart-checkpoints' ||
        format('conditional-dusart-checkpoints-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  release_version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_ready: ${{ steps.version.outputs.release_ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate committed release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < RELEASE_VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=RELEASE_VERSION::Expected one semantic version such as 0.1.0"
            exit 1
          fi
          if [[ "$(cat RELEASE_VERSION)" != "$version" ]]; then
            echo "::error file=RELEASE_VERSION::Release version contains surrounding whitespace"
            exit 1
          fi
          tag="v$version-conditional.${GITHUB_SHA:0:12}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if grep -Fq 'TEMPLATE:' formalization.yaml; then
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release_ready=true" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" != refs/heads/main ]] ||
             [[ "$GITHUB_EVENT_NAME" != push && "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            exit 0
          fi

          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tagged_commit=$(git rev-list -n 1 "$tag")
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "::error file=RELEASE_VERSION::$tag belongs to $tagged_commit; bump RELEASE_VERSION before the long build"
              exit 1
            fi
          fi

  metadata-and-boundary:
    name: Metadata, source policy, and private boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Test the Palomar metadata validator
        run: ruby test/validate_formalization_test.rb
      - name: Validate lifecycle metadata and public source boundary
        run: python scripts/check.py --profile fast
      - name: Detect the repository licence
        run: |
          bundle exec licensee detect LICENSE --json --no-packages --no-readme > "$RUNNER_TEMP/license.json"
          ruby -rjson -e '
            report = JSON.parse(File.read(ARGV.fetch(0)))
            identifiers = report.fetch("licenses").map { |item| item.fetch("spdx_id") }
            abort "LICENSE is not detected exactly as Apache-2.0" unless identifiers == ["Apache-2.0"]
          ' "$RUNNER_TEMP/license.json"

  release-licensing:
    name: Check release licensing bundles
    if: ${{ vars.CONDITIONAL_CI_BUILDS == 'enabled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          lint: false
      - name: Fetch the pinned project dependencies
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: lake update
      - name: Fetch the pinned documentation dependencies
        working-directory: docbuild
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: lake update
      - name: Exercise producer and release-consumer packaging
        # Both dependency updates above share the project package directory.
        shell: pwsh
        run: |
          python3 scripts/patch_pnt_compat.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 scripts/patch_primecert_compat.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./test/release_licensing_test.ps1

  python:
    name: Python format, lint, types, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned development tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Check formatting
        run: python -m ruff format --check scripts test/python
      - name: Lint
        run: python -m ruff check scripts test/python
      - name: Type-check
        run: python -m mypy scripts test/python
      - name: Test
        run: python -m pytest

  sandbox:
    name: Check the Landrun wrapper's flag policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test the Landrun wrapper
        run: ./test/landrun_wrapper_test.sh

  lean-foundations:
    name: Elaborate conditional non-certificate foundations
    if: ${{ vars.CONDITIONAL_CI_BUILDS == 'enabled' }}
    needs: [python]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Apply reviewed compatibility ports
        run: |
          python3 scripts/patch_pnt_compat.py
          python3 scripts/patch_primecert_compat.py
      - name: Build named targets serially with durable checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .research
          python3 -m scripts.conditional_dusart_ci --stage foundations --minutes 280 2>&1 |
            tee .research/conditional-foundations.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: conditional-foundations-diagnostics
          path: .research/conditional-foundations.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: conditional-foundations-build
          path: .lake/build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  certificate-prebuild:
    name: Prebuild high-memory conditional certificate chains
    if: ${{ vars.CONDITIONAL_CI_BUILDS == 'enabled' }}
    needs: [release_version, metadata-and-boundary, python, lean-foundations]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Apply reviewed compatibility ports
        run: |
          python3 scripts/patch_pnt_compat.py
          python3 scripts/patch_primecert_compat.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: conditional-foundations-build
          path: .lake/build
      - name: Build named targets serially with durable checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .research
          python3 -m scripts.conditional_dusart_ci --stage prebuild --minutes 280 2>&1 |
            tee .research/conditional-prebuild.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: conditional-prebuild-diagnostics
          path: .research/conditional-prebuild.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: conditional-certificate-prebuild
          path: .lake/build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  analytic-tail:
    name: Check the certificate-independent all-k reduction
    if: ${{ vars.CONDITIONAL_CI_BUILDS == 'enabled' }}
    needs: [lean-foundations]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Apply reviewed compatibility ports
        run: |
          python3 scripts/patch_pnt_compat.py
          python3 scripts/patch_primecert_compat.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: conditional-foundations-build
          path: .lake/build
      - name: Verify the finite Abel shell and all-k assembly
        run: |
          python3 scripts/check_tail_replacement.py
          lake build +PrimeFactorUnimodality.Proof.CompleteClassificationReduction
          lake env lean test/lean/TailThetaBounds.lean
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: conditional-analytic-tail
          path: .lake/build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  build:
    name: Replay remaining certificates and build the conditional theorem
    if: ${{ vars.CONDITIONAL_CI_BUILDS == 'enabled' }}
    needs: [release_version, metadata-and-boundary, python, certificate-prebuild, analytic-tail]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Apply reviewed compatibility ports
        run: |
          python3 scripts/patch_pnt_compat.py
          python3 scripts/patch_primecert_compat.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: conditional-certificate-prebuild
          path: .lake/build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: conditional-analytic-tail
          path: .lake/build
      - name: Build named targets serially with durable checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .research
          python3 -m scripts.conditional_dusart_ci --stage build --minutes 280 2>&1 |
            tee .research/conditional-build.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: conditional-build-diagnostics
          path: .research/conditional-build.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Package the full compiled conditional dependency closure
        run: |
          python3 -m scripts.conditional_release_bundle \
            --receipt .research/conditional-audit.json --commit "$GITHUB_SHA" \
            --output .research/conditional-build-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: conditional-proof-audit
          path: .research/conditional-audit.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: conditional-linux-lean-build
          path: .lake/build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: conditional-build-release
          path: .research/conditional-build-release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  docs:
    name: Build conditional API documentation
    if: ${{ vars.CONDITIONAL_CI_BUILDS == 'enabled' }}
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Apply reviewed compatibility ports
        run: |
          python3 scripts/patch_pnt_compat.py
          python3 scripts/patch_primecert_compat.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: conditional-linux-lean-build
          path: .lake/build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: conditional-proof-audit
          path: .research/docs-audit
      - name: Fetch pinned documentation dependencies
        working-directory: docbuild
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: lake update
      - name: Restore reusable documentation database
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            docbuild/.lake/build/api-docs.db*
            docbuild/.lake/build/conditional-doc-state.json
          key: >-
            conditional-docs-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain',
            'docbuild/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: >-
            conditional-docs-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain',
            'docbuild/lake-manifest.json') }}-
      - name: Build only the conditional documentation closure
        run: |
          python3 -m scripts.conditional_docs \
            --receipt .research/docs-audit/conditional-audit.json --commit "$GITHUB_SHA"
      - name: Preserve completed documentation scans
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            docbuild/.lake/build/api-docs.db*
            docbuild/.lake/build/conditional-doc-state.json
          key: >-
            conditional-docs-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain',
            'docbuild/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prepare the offline documentation and licensing bundle
        shell: pwsh
        run: |
          ./scripts/prepare-api-docs.ps1 -DocumentationRoot docbuild/.lake/build/doc `
            -TemplatePath assets/conditional-api-documentation-index.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: conditional-api-documentation
          path: docbuild/.lake/build/doc
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  paper:
    name: Build separate conditional research paper
    if: ${{ vars.CONDITIONAL_CI_BUILDS == 'enabled' }}
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: conditional-proof-audit
          path: .research/paper-audit
      - name: Install paper toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            lmodern poppler-utils texlive-latex-base texlive-latex-recommended
      - name: Generate, build and inspect the conditional paper
        run: |
          python3 -m scripts.conditional_paper \
            --receipt .research/paper-audit/conditional-audit.json --commit "$GITHUB_SHA" \
            --output .research/conditional-paper
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: conditional-research-paper
          path: .research/conditional-paper
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  submission-link:
    name: Check submission link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require the current Palomar form and reject the retired form
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          form = "https://submit.palomar-registry.org/"
          retired = re.compile(r"PalomarSubmission/issues/new")
          failed = False
          if form not in pathlib.Path("README.md").read_text():
              print(f"README.md: does not name {form}")
              failed = True
          for document in sorted(pathlib.Path(".").rglob("*.md")):
              if ".lake" in document.parts:
                  continue
              for number, line in enumerate(document.read_text().splitlines(), 1):
                  if retired.search(line):
                      print(f"{document}:{number}: retired Palomar form")
                      failed = True
          raise SystemExit(failed)
          PY

  release:
    name: Publish conditional release
    if: >-
      vars.CONDITIONAL_CI_BUILDS == 'enabled' &&
      needs.release_version.outputs.release_ready == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [release_version, metadata-and-boundary, release-licensing, python, sandbox, build, docs, paper, submission-link]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: conditional-build-release
          path: .research/conditional-release-inputs/build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: conditional-research-paper
          path: .research/conditional-release-inputs/paper
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: conditional-api-documentation
          path: .research/conditional-release-inputs/docs
      - name: Recheck documentation links and included licensing
        shell: pwsh
        run: |
          ./scripts/prepare-api-docs.ps1 `
            -DocumentationRoot .research/conditional-release-inputs/docs `
            -TemplatePath assets/conditional-api-documentation-index.html -UsePreparedLicensing
      - name: Validate, package, and publish the exact conditional artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release_version.outputs.tag }}
        run: |
          python3 -m scripts.publish_conditional_release \
            --inputs .research/conditional-release-inputs --commit "$GITHUB_SHA" \
            --output .research/conditional-release-assets
