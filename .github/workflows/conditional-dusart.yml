name: Conditional all-k proof

# Deliberately independent of the paused unconditional workflow. Re-dispatch
# after a source repair or budget stop to reuse the uploaded checkpoints.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conditional-dusart-checkpoints
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: .githooks/pre-commit

  conditional:
    name: Check exact all-k theorem assuming the three Dusart bounds
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Apply reviewed dependency compatibility patches
        run: |
          python3 scripts/patch_pnt_compat.py
          python3 scripts/patch_primecert_compat.py
      - name: Build in dependency order and save completed units
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .research
          python3 -m scripts.conditional_dusart_ci --minutes 280 2>&1 |
            tee .research/conditional-dusart.log
      - name: Preserve diagnostics even after a failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: conditional-dusart-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: .research/conditional-dusart.log
          if-no-files-found: ignore
          retention-days: 30
